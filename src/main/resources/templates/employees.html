<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Employees</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin-bottom: 25px;
        }

        .add-button {
            display: inline-block;
            background: #198754;
            color: white;
            padding: 14px 22px;
            text-decoration: none;
            border-radius: 6px;
            font-size: 18px;
            margin-bottom: 25px;
        }

        .add-button:hover {
            background: #157347;
        }

        .logout-button {
            background: #dc3545;
            color: white;
            border: none;
            padding: 14px 22px;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
        }

        .logout-button:hover {
            background: #bb2d3b;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th {
            background: #343a40;
            color: white;
            padding: 14px;
            text-align: left;
            font-size: 18px;
        }

        td {
            padding: 14px;
            border: 1px solid #ddd;
            font-size: 18px;
        }

        .edit {
            color: #0d6efd;
            text-decoration: none;
            margin-right: 10px;
        }

        .delete {
            color: #dc3545;
            text-decoration: none;
        }

        .edit:hover,
        .delete:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Employee Management</h1>

        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-button">Logout</button>
        </form>
    </div>

    <a href="/employees/new" class="add-button">
        Add Employee
    </a>

    <table>

        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Department</th>
            <th>Position</th>
            <th>Salary</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="employee, status : ${employees}">

            <!-- Display sequential number -->
            <td th:text="${status.index + 1}"></td>

            <td th:text="${employee.name}"></td>

            <td th:text="${employee.email}"></td>

            <td th:text="${employee.department}"></td>

            <td th:text="${employee.position}"></td>

            <td th:text="${employee.salary}"></td>

            <td>
                <!-- Uses the REAL database ID -->
                <a class="edit"
                   th:href="@{/employees/edit/{id}(id=${employee.id})}">
                    Edit
                </a>

                <!-- Uses the REAL database ID -->
                <a class="delete"
                   th:href="@{/employees/delete/{id}(id=${employee.id})}"
                   onclick="return confirm('Are you sure you want to delete this employee?');">
                    Delete
                </a>
            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
